---
# Deploys one service's docker-compose.yml (an exact git commit, already
# cloned by Jenkins) onto its target host. Called by Jenkinsfile.deploy:
#   ansible-playbook -i "<target_host>," ansible/deploy-compose.yml -e @vars.json
# Runs as the SSH user (in the docker group on the target) - no become.
- name: Deploy docker-compose service
  hosts: all
  gather_facts: false
  tasks:
    - name: Check required variables
      assert:
        that:
          - service_name is match('^[a-z0-9][a-z0-9_-]*$')
          - compose_src is defined
          - deploy_dir is match('^/')
          - git_commit is defined
        fail_msg: "service_name/compose_src/deploy_dir/git_commit must be passed by the pipeline."

    - name: Detect the docker compose command on the target
      shell: |
        if docker compose version >/dev/null 2>&1; then echo "docker compose"
        elif docker-compose version >/dev/null 2>&1; then echo "docker-compose"
        else exit 1; fi
      register: compose_cmd
      changed_when: false
      failed_when: compose_cmd.rc != 0

    - name: Check whether this compose supports `up --wait`
      shell: "{{ compose_cmd.stdout }} up --help | grep -q -- '--wait'"
      register: compose_wait_support
      changed_when: false
      failed_when: false

    - name: Ensure the deploy directory exists
      file:
        path: "{{ deploy_dir }}"
        state: directory
        mode: "0755"

    - name: Upload docker-compose.yml (from git commit {{ git_commit[:10] }})
      copy:
        src: "{{ compose_src }}"
        dest: "{{ deploy_dir }}/docker-compose.yml"
        mode: "0644"

    - name: Record what is deployed here
      copy:
        dest: "{{ deploy_dir }}/.compose-paas.json"
        mode: "0644"
        content: "{{ {'service': service_name, 'git_repo': git_repo | default(''), 'git_branch': git_branch | default(''),
                      'git_path': git_path | default(''), 'git_commit': git_commit,
                      'requested_by': requested_by | default(''), 'approved_by': approved_by | default(''),
                      'jenkins_build': jenkins_build | default('')} | to_nice_json }}\n"

    - name: docker compose up
      # --wait (when available) makes the deploy fail if a container exits or
      # never becomes healthy, instead of reporting success for a crash loop.
      command: >-
        {{ compose_cmd.stdout }} -p {{ service_name }} -f docker-compose.yml up -d --remove-orphans
        {{ '--wait --wait-timeout 180' if compose_wait_support.rc == 0 else '' }}
      args:
        chdir: "{{ deploy_dir }}"
      register: compose_up

    - name: docker compose ps
      command: "{{ compose_cmd.stdout }} -p {{ service_name }} ps"
      args:
        chdir: "{{ deploy_dir }}"
      register: compose_ps
      changed_when: false

    - name: Result
      debug:
        msg: "{{ (compose_up.stderr_lines | default([])) + [''] + compose_ps.stdout_lines }}"
