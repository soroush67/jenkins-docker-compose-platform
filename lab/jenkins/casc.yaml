# Jenkins configuration as code (lab). Passwords/tokens come from the
# environment (secrets/jenkins.env) and /run/secrets, never from this file.
jenkins:
  systemMessage: "compose-cd (lab) - upload docker-compose files to the CD repository"
  numExecutors: 4
  # The pipelines run on nodes labelled `cd` (they only need git). In the
  # lab that's the built-in node; in production, any agent with git.
  labelString: "cd"
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: admin
          name: "Platform Admin"
          password: ${JENKINS_ADMIN_PASSWORD}
        - id: dev1
          name: "Developer One"
          password: ${JENKINS_DEV1_PASSWORD}
        - id: dev2
          name: "Developer Two"
          password: ${JENKINS_DEV2_PASSWORD}
  # Role-based: developers can only see and BUILD the jobs in the `cd`
  # folder. No Configure, no Workspace, no access to `cd-admin`.
  authorizationStrategy:
    roleBased:
      roles:
        global:
          - name: "admin"
            permissions:
              - "Overall/Administer"
            entries:
              - user: "admin"
          - name: "authenticated-read"
            permissions:
              - "Overall/Read"
            entries:
              - group: "authenticated"
        items:
          - name: "cd-user"
            pattern: "cd(/.*)?"
            permissions:
              - "Job/Read"
              - "Job/Build"
            entries:
              - user: "dev1"
              - user: "dev2"
  globalNodeProperties:
    - envVars:
        env:
          - {key: CD_REPO, value: "http://cp-gitlab/platform/cd.git"}
          - {key: CD_BRANCH, value: "main"}
          - {key: CD_GIT_CRED, value: "gitlab-bot"}
          - {key: CD_PIPELINE_REPO, value: "http://cp-gitlab/platform/compose-cd.git"}
          - {key: CD_PIPELINE_BRANCH, value: "main"}

security:
  # The refresh job's Job DSL script comes from the admin-owned pipeline
  # repo and the job itself is admin-only.
  globalJobDslSecurityConfiguration:
    useScriptSecurity: false

credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              scope: GLOBAL
              id: gitlab-bot
              description: "GitLab bot account: read the pipeline repo, read + push the CD repo"
              username: jenkins-bot
              password: ${readFile:/run/secrets/gitlab-bot-token}

unclassified:
  location:
    url: http://localhost:8090/

jobs:
  # Only the admin job is created here; it generates the developer jobs
  # from the compose files it finds in the CD repo (jenkins/Jenkinsfile.refresh).
  - script: |
      folder('cd-admin') {
        description('Admin only - not visible to developers.')
      }
      pipelineJob('cd-admin/refresh-paths') {
        description('Scans the CD repository for compose files and (re)generates the developer jobs in the cd folder. Also runs by itself when the CD repo changes.')
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('http://cp-gitlab/platform/compose-cd.git')
                  credentials('gitlab-bot')
                }
                branch('*/main')
              }
            }
            scriptPath('jenkins/Jenkinsfile.refresh')
            lightweight(true)
          }
        }
      }
