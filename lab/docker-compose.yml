# Local test lab for compose-cd: GitLab CE (same version as the company
# GitLab) holding a CD repository, and Jenkins as the upload UI. Secrets live
# in .env / secrets/ (created by up.sh, git-ignored). Container names/ports
# differ from the git-policy lab so both can run side by side.
name: compose-paas-lab

services:
  gitlab:
    image: gitlab/gitlab-ce:17.10.5-ce.0
    container_name: cp-gitlab
    hostname: cp-gitlab
    restart: unless-stopped
    shm_size: 256m
    ports:
      - "8929:80"
    environment:
      GITLAB_ROOT_PASSWORD: ${GITLAB_ROOT_PASSWORD:?run up.sh}
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://localhost:8929'
        nginx['listen_port'] = 80
        gitlab_rails['initial_root_password'] = ENV['GITLAB_ROOT_PASSWORD']
        gitlab_rails['usage_ping_enabled'] = false
        puma['worker_processes'] = 0
        sidekiq['concurrency'] = 5
        prometheus_monitoring['enable'] = false
    volumes:
      - gitlab-config:/etc/gitlab
      - gitlab-logs:/var/log/gitlab
      - gitlab-data:/var/opt/gitlab
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/-/readiness"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 300s


  jenkins:
    build: ./jenkins
    container_name: cp-jenkins
    hostname: cp-jenkins
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      CASC_JENKINS_CONFIG: /usr/share/jenkins/ref/casc.yaml
      JAVA_OPTS: -Djenkins.install.runSetupWizard=false
    env_file: ./secrets/jenkins.env
    volumes:
      - jenkins-home:/var/jenkins_home
      - ./secrets/gitlab-bot-token:/run/secrets/gitlab-bot-token:ro

volumes:
  gitlab-config:
  gitlab-logs:
  gitlab-data:
  jenkins-home:
